<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#091829" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Outer Shield Border Gold -->
    <path d="M 250 20 
             C 380 20, 460 60, 460 140 
             C 460 340, 390 450, 250 540 
             C 110 450, 40 340, 40 140 
             C 40 60, 120 20, 250 20 Z" 
          fill="url(#goldGrad)" stroke="#a16207" stroke-width="4" />

    <!-- Inner Shield Navy -->
    <path d="M 250 35 
             C 365 35, 440 72, 440 145 
             C 440 330, 375 432, 250 518 
             C 125 432, 60 330, 60 145 
             C 60 72, 135 35, 250 35 Z" 
          fill="url(#shieldGrad)" stroke="#fef08a" stroke-width="3" />

    <!-- Peruvian Banner Accents (Top interior) -->
    <path d="M 100 80 Q 250 110 400 80 Q 250 95 100 80 Z" fill="#ef4444" opacity="0.3" />

    <!-- Top Text Arc: I.E. DIONISIO MANCO CAMPOS -->
    <path id="textArc" d="M 85 155 C 130 90, 370 90, 415 155" fill="none" />
    <text font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="20" fill="#fef08a" letter-spacing="2.5" text-anchor="middle">
      <textPath href="#textArc" startOffset="50%">I.E. DIONISIO MANCO CAMPOS</textPath>
    </text>

    <!-- Subtitle: MALA - CAÑETE -->
    <text x="250" y="165" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="14" fill="#93c5fd" letter-spacing="3" text-anchor="middle">
      MALA • CAÑETE
    </text>

    <!-- Year 1962 Badge -->
    <rect x="210" y="180" width="80" height="24" rx="12" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    <text x="250" y="197" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f2942" text-anchor="middle">
      DESDE 1962
    </text>

    <!-- Laurel Wreath Left -->
    <g fill="#eab308" opacity="0.85">
      <path d="M 125 320 C 110 270, 135 220, 160 190 C 150 215, 140 250, 150 280 Z" />
      <circle cx="130" cy="230" r="6" />
      <circle cx="120" cy="265" r="7" />
      <circle cx="122" cy="305" r="7.5" />
      <circle cx="138" cy="345" r="8" />
      <circle cx="165" cy="385" r="8.5" />
      <circle cx="200" cy="415" r="9" />
    </g>

    <!-- Laurel Wreath Right -->
    <g fill="#eab308" opacity="0.85">
      <path d="M 375 320 C 390 270, 365 220, 340 190 C 350 215, 360 250, 350 280 Z" />
      <circle cx="370" cy="230" r="6" />
      <circle cx="380" cy="265" r="7" />
      <circle cx="378" cy="305" r="7.5" />
      <circle cx="362" cy="345" r="8" />
      <circle cx="335" cy="385" r="8.5" />
      <circle cx="300" cy="415" r="9" />
    </g>

    <!-- Central Flame of Knowledge (Antorcha) -->
    <!-- Torch Handle -->
    <path d="M 243 320 L 257 320 L 253 380 L 247 380 Z" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5" />
    <!-- Torch Bowl -->
    <path d="M 233 318 C 233 310, 267 310, 267 318 L 260 330 L 240 330 Z" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5" />
    <!-- Bright Flame -->
    <path d="M 250 220 
             C 275 255, 275 285, 260 310 
             C 255 295, 252 285, 245 280 
             C 248 295, 242 305, 238 310 
             C 225 285, 230 255, 250 220 Z" 
          fill="url(#flameGrad)" />

    <!-- Open Book (Libro de la Ciencia y la Virtud) -->
    <g transform="translate(250, 365)">
      <!-- Book spine shadow -->
      <path d="M -80 0 Q -40 -12 0 10 Q 40 -12 80 0 L 80 40 Q 40 28 0 50 Q -40 28 -80 40 Z" fill="#091829" opacity="0.6"/>
      <!-- Left Page -->
      <path d="M -78 -2 Q -38 -14 0 8 L 0 46 Q -38 26 -78 36 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Right Page -->
      <path d="M 0 8 Q 38 -14 78 -2 L 78 36 Q 38 26 0 46 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Lines Left -->
      <line x1="-65" y1="12" x2="-15" y2="18" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <line x1="-65" y1="20" x2="-15" y2="26" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <line x1="-65" y1="28" x2="-25" y2="34" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <!-- Lines Right -->
      <line x1="15" y1="18" x2="65" y2="12" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="26" x2="65" y2="20" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="34" x2="65" y2="28" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <!-- Golden ribbon bookmark -->
      <path d="M 0 8 L 0 56 L 6 50 L 12 56 L 12 8 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Three Stars of Excellence -->
    <g fill="#fef08a" stroke="#ca8a04" stroke-width="1">
      <!-- Left Star -->
      <polygon points="180,250 184,260 195,260 186,267 189,277 180,271 171,277 174,267 165,260 176,260" />
      <!-- Center Top Star -->
      <polygon points="250,205 254,215 265,215 256,222 259,232 250,226 241,232 244,222 235,215 246,215" />
      <!-- Right Star -->
      <polygon points="320,250 324,260 335,260 326,267 329,277 320,271 311,277 314,267 305,260 316,260" />
    </g>

    <!-- Bottom Motto Ribbon -->
    <g transform="translate(0, 480)">
      <!-- Ribbon back folds -->
      <path d="M 45 10 L 80 -15 L 80 25 Z" fill="#7f1d1d" />
      <path d="M 455 10 L 420 -15 L 420 25 Z" fill="#7f1d1d" />
      <!-- Main Ribbon Banner -->
      <path d="M 60 15 
               Q 250 -15 440 15 
               L 430 55 
               Q 250 25 70 55 Z" 
            fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
      <!-- Motto Text: PATRIA • ESTUDIO • DISCIPLINA -->
      <text x="250" y="36" 
            font-family="'Outfit', 'Montserrat', Arial, sans-serif" 
            font-weight="900" 
            font-size="16" 
            fill="#ffffff" 
            letter-spacing="2.5" 
            text-anchor="middle"
            filter="drop-shadow(0 2px 2px rgba(0,0,0,0.6))">
        PATRIA • ESTUDIO • DISCIPLINA
      </text>
    </g>
  </g>
</svg>
